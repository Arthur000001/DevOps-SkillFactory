
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-csv-runner"
version = "0.1.0"
description = "CLI для потоковой обработки CSV из Kaggle (тиражируемое)"
authors = [{ name = "Your Team", email = "team@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "typer[all]>=0.12.3",
  "matplotlib>=3.8",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=3.7"
]

[project.scripts]
kcsv = "kcsv.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
